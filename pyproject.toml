[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "libcloud-noderings"
description = "Apache Libcloud compute and DNS drivers for NodeRings"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "NodeRings", email = "partners@noderings.com" }]
requires-python = ">=3.10"
dependencies = ["apache-libcloud>=3.8,<4"]
dynamic = ["version"]
keywords = ["libcloud", "noderings", "cloud", "vps", "dns", "compute"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
  "Topic :: Internet :: Name Service (DNS)",
]

[project.urls]
Homepage = "https://github.com/noderings/libcloud-noderings"
Issues = "https://github.com/noderings/libcloud-noderings/issues"
Changelog = "https://github.com/noderings/libcloud-noderings/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "requests-mock>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls the real NodeRings API (needs NODERINGS_TOKEN)",
  "billed: orders a billed server (needs NODERINGS_TEST_BILLED=1)",
]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["src/libcloud_noderings/_api", "tests/fakeapi.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
